name: Research and component tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned for this research snapshot
        with:
          persist-credentials: false
      - name: Check original native PPC fixture and codegen input identity
        run: python3 tests/native-image-binding/test_fixture.py
      - name: Check nonexecuting startup dependencies and source-bound proof refusals
        run: python3 tests/startup-dependencies/test_static.py
      - name: Check original stack geometry, context dependencies and closed-call inputs
        run: python3 tests/stack-geometry/test_fixture.py
      - name: Check conditional stack-renaming model and original counterexample inputs
        run: python3 tests/context-equivalence/test_model.py
      - name: Check typed pointer graphs, lifetime refusals and original nested-frame inputs
        run: python3 tests/stack-provenance/test_model.py
      - name: Check independently authored fixed-write instruction and effect oracle
        run: python3 tests/writable-startup/test_fixture.py
      - name: Check source-bound writable region, subrange refusal and lifecycle
        run: python3 tests/writable-image/run.py --workdir "${{ runner.temp }}/writable-image"
      - name: Check original integrated module encoding and independent arithmetic
        run: python3 tests/module-startup/test_fixture.py
      - name: Check exact RO forensic subranges and excluded-gap refusals
        run: python3 tests/data-projection/run.py --workdir "${{ runner.temp }}/data-projection"
      - name: Check minimal module metadata, coupled lifetime and transactional cleanup
        run: python3 tests/native-module/run.py --workdir "${{ runner.temp }}/native-module"
      - name: Check selected variable cell binding, generation and withdrawal
        run: python3 tests/variable-imports/run.py --workdir "${{ runner.temp }}/variable-imports"
      - name: Check owned sealed guest metadata and last-reader cleanup in three profiles
        run: python3 tests/header-buffer/run.py --workdir "${{ runner.temp }}/header-buffer"
      - name: Check absent versus malformed XEX field contracts on original metadata
        run: python3 tests/header-field/test_contract.py
      - name: Check nonexecuting module-provider snapshots and strict selected-header parser
        run: python3 tests/module-provider/test_contract.py
      - name: Check metadata-bound static callee observations and unknown-call barriers
        run: python3 tests/callee-observations/test_static.py
      - name: Check non-admitting interval provenance on original fixtures
        run: python3 tests/native-provenance/test_intervals.py
      - name: Check resource coordinates, PNG CRC, initialization and binding identities
        run: python3 tests/native-provenance/test_initialization.py
      - name: Check inert bounded data contracts without guest admission
        run: python3 tests/native-provenance/run_data.py --workdir "${{ runner.temp }}/offline-image-data"
      - name: Check exact owned stack windows and current checked-memory permissions
        run: python3 tests/pre-entry-stack/run.py --workdir "${{ runner.temp }}/stack-window"
      - name: Check DATA-only validator refusals in three profiles
        run: python3 tests/native-provenance/run_reader.py --workdir "${{ runner.temp }}/native-provenance-reader"
      - name: Check original overhanging-section ownership and rollback
        run: python3 tests/native-image-contract/run.py --workdir "${{ runner.temp }}/native-image-tail"
      - name: Check native image plan canonical identity and owned transactions
        run: python3 tests/native-image-plan/run.py --workdir "${{ runner.temp }}/native-image-plan"
      - name: Check public research contents and local links
        run: python3 tools/check_public_tree.py
      - name: Check independent original XEX observation corpus and pinned fixture identities
        run: python3 tests/loader-observation/test_corpus.py
      - name: Check host-only compatibility refusal and cleanup contracts in three profiles
        run: python3 tests/compatibility-services/run.py --workdir "${{ runner.temp }}/compatibility-services"
      - name: Check original static residency evidence fixtures (no SDK or title input)
        run: python3 tests/residency-evidence/test_residency.py
      - name: Check original static-audit fixtures
        run: python3 tests/guest-memory/test_audit.py
      - name: Check original instrumentation census fixtures
        run: python3 tests/instrumentation/test_audit.py
      - name: Check original readiness audit fixtures
        run: python3 tests/readiness/test_audit.py
      - name: Check original bounded startup encoding and bindings
        run: python3 tests/entry-contracts/test_fixture.py
      - name: Check bounded manifest identities and independent CFG fixtures
        run: python3 tests/bounded-cfg/test_manifest.py
      - name: Check original synthetic module encoding
        run: python3 tests/synthetic/test_fixture.py
      - name: Check original generated caller encoding
        run: python3 tests/generated-dispatch/test_fixture.py
      - name: Check original XEX layout and relocation encoding
        run: python3 tests/xex-binding/test_fixture.py
      - name: Check original loop encoding and fail-closed safe-point census
        run: python3 tests/generated-loop-stop/test_fixture.py
      - name: Check original import matrix, fixture catalog and scoped policy
        run: python3 tests/tls-import/audit.py --matrix-only
      - name: Check monotonic watchdog and process group cleanup
        run: python3 tests/ppc/test_watchdog.py
      - name: Check original portable Horizon component contracts on host
        run: python3 tests/switch-horizon/run.py --workdir "${{ runner.temp }}/horizon-host"
      - name: Check safe Switch deployment on mock filesystems only
        run: python3 tests/switch-horizon/test_deploy.py
      - name: Check original PPC leaf encoding and separate USB destination on mocks
        run: python3 tests/horizon-runtime/test_contract.py
      - name: Check public Horizon foundation memory and thread contracts
        run: python3 tests/horizon-foundation/core.py --workdir "${{ runner.temp }}/horizon-foundation-core"
      - name: Check independent original Horizon XEX encoding and parser inputs
        run: python3 tests/horizon-xex/test_fixture.py
      - name: Check expanded original PPC encoding and independent hook census
        run: python3 tests/horizon-expansion/test_fixture.py
      - name: Check integrated app deployment refusal on mock filesystems
        run: python3 tests/horizon-expansion/test_deploy.py
      - name: Check integrated package provenance on original unit fixtures
        run: python3 tests/horizon-expansion/test_package.py
      - name: Check original Runtime II ABI and instruction policy fixtures
        run: python3 tests/horizon-runtime-ii/test_fixture.py
      - name: Check portable Runtime II query metadata contracts
        run: python3 tests/horizon-runtime-ii/query_core.py --workdir "${{ runner.temp }}/runtime-ii-query"
      - name: Check portable Runtime II bounded diagnostic contracts
        run: python3 tests/horizon-runtime-ii/diagnostics_core.py --workdir "${{ runner.temp }}/runtime-ii-diagnostics"
      - name: Check Runtime II package and separate USB destination on mocks
        run: |
          python3 tests/horizon-runtime-ii/test_package.py
          python3 tests/horizon-runtime-ii/test_deploy.py
      - name: Check original hardware acceptance fixture encoding and fail-closed policy
        run: python3 tests/horizon-acceptance/test_fixture.py
      - name: Check acceptance lifecycle and controller contracts
        run: python3 tests/horizon-acceptance/lifecycle_core.py --workdir "${{ runner.temp }}/acceptance-lifecycle"
      - name: Check acceptance UI supervision and separate deployment
        run: |
          python3 tests/horizon-acceptance/supervisor_core.py --workdir "${{ runner.temp }}/acceptance-ui"
          python3 tests/horizon-acceptance/test_package.py
          python3 tests/horizon-acceptance/test_deploy.py
      - name: Check bounded diagnostic path sanitization on synthetic ELF fixtures
        run: python3 tests/switch-horizon/test_sanitize.py

  runtime-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        profile: [O0, O2, sanitized]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and execute original runtime components
        shell: bash
        run: |
          flags=()
          if [[ "${{ matrix.profile }}" == "O2" ]]; then flags+=(--optimization 2); fi
          if [[ "${{ matrix.profile }}" == "sanitized" ]]; then flags+=(--sanitize); fi
          python3 tests/runtime/run.py --workdir "${{ runner.temp }}/brutal-foundation-${{ matrix.profile }}" "${flags[@]}"
